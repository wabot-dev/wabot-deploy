name: ci

# Branches, never tags. A tag pushed alongside the commit it names ran
# this three times over one commit: `ci` for the branch, `ci` again for
# the tag, and `release`. The second was the same three commands on the
# same sha under a different name.
#
# The gate on a tag is `release.yml`'s own `Check` step, which is there
# because a tag can point at a commit this workflow never saw — so
# excluding tags here does not leave one ungated, it stops paying twice
# for the one that is.
on:
  push:
    branches:
      - "**"
  pull_request:

# A push that supersedes another cancels it. Two commits a minute apart
# otherwise hold two runners to answer about the older one.
#
# Per ref, so main and a branch never cancel each other. `release` has no
# group of its own on purpose: a publish is not something to interrupt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compiler comes from `rust-toolchain.toml`, read rather than
      # repeated: naming the version in two places is the same drift
      # that pinning was supposed to end, moved somewhere new. The
      # components have to be installed for *that* toolchain — asking
      # for them on `stable` installs them under a different name, and
      # `cargo fmt` then fails saying rustfmt is not installed.
      - id: toolchain
        run: sed -n 's/^channel *= *"\(.*\)"/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # containerd's API arrives as .proto files and prost-build shells
      # out to protoc to read them. Without this the build fails at a
      # dependency, which reads as the dependency being broken.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
