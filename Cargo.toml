[package]
name = "wabot-deploy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Features decide what you pay for. Adding one later is a one-line change;
# the umbrella re-exports everything under `wabot::<area>`.
wabot = { version = "0.1", features = [
    "rest",
    "pg",
    "async-jobs",
] }

tokio = { version = "1", features = ["full"] }
# Reads `.env` at startup, so the same binary works in development and
# under a process manager that sets real environment variables.
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The harnesses are a separate feature so a mock LLM adapter can never
# reach production by accident.
wabot = { version = "0.1", features = ["testing"] }

# Temporary: the framework is not on crates.io yet (5 of 33 crates
# published). Pointing at the sibling checkout is what lets this build
# today. Delete this section once `wabot 0.1` resolves from the
# registry — the version above is already correct.
[patch.crates-io]
wabot = { path = "../../framework/wabot-rust/crates/wabot" }
