# A node on this machine: Alpine, like the test nodes, on this
# machine's own architecture. `scripts/vm.sh` is what uses it.
vmType: vz
cpus: 2
memory: 2GiB
disk: 20GiB

images:
  - location: "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/cloud/nocloud_alpine-3.21.2-aarch64-uefi-cloudinit-r0.qcow2"
    arch: "aarch64"
    digest: "sha512:08d340126b222abae651a20aa63c3ee3dc601d703de7879d2a6bc1fe82a3664d058a2c55ad0cf8a874327f7535e3af8a9384ce438217d6f32200cad1462a5b32"
  - location: "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/cloud/nocloud_alpine-3.21.2-x86_64-uefi-cloudinit-r0.qcow2"
    arch: "x86_64"
    digest: "sha512:1aaf22b4a584e69e228e6aa38a295159c0143d9ccebe7ad4928e92b414714066af3bfe5f9e0ca4d4d64a70ca9fea09033af90258a6f2344130d70b660151127a"

# Nothing of this machine's: the node runs containers as root, and a
# node that could read the home directory it was built from is not the
# node it will be.
mounts: []

# `install` puts its own containerd on the node, and a second one from
# Lima would be the one the node does not know about.
containerd:
  system: false
  user: false

# The node's two ports, on ports this machine lets anybody bind, and
# nothing else: a container a test publishes stays inside the VM.
portForwards:
  - guestPort: 443
    hostPort: 9443
  - guestPort: 80
    hostPort: 9080
  - guestPortRange: [1, 65535]
    ignore: true
