[package]
name = "wabot-deploy"
version = "0.6.1"
edition = "2021"

[dependencies]
# Only what this milestone uses. `rest-tls`, `ui` and the job
# repositories arrive with the milestones that need them — a feature
# turned on "for later" is a dependency tree paid for now.
wabot = { version = "0.2", default-features = false, features = [
    "rest",
    "rest-tls",
    "sqlite",
    # Deploying is a job, not a request: it outlives the POST that asks
    # for it, and it has to survive the process being replaced — which
    # is a thing that happens here on purpose, since the updater ends
    # by restarting the node. See `deploy::jobs`.
    "addon-async-sqlite",
    # Server-rendered pages. No Node and no build step — the console is
    # HTML the node produces, which is the right shape for something
    # that has to work on a box with no internet access.
    #
    # There *is* a client payload: this feature serves the framework's
    # runtime at `/_wabot/client.js` and every page loads it. It
    # hydrates islands and boosts navigation, and it has been doing
    # both since the first page rendered. Two bugs came from not
    # knowing that, so it is written down here now — see the island
    # rules in CLAUDE.md.
    #
    # `ui-hypertext` rather than `ui` (Maud) for one reason: it
    # validates element *and* attribute names at compile time. Maud
    # escapes values and typechecks Rust, but happily emits
    # `<dvi klass="x">` — verified, not assumed. A typo in a template
    # should be a build error, not malformed HTML nobody notices.
    "ui-hypertext",
    "tracing-format",
] }

# Explicit features, not `full`: `full` brings `process`, all of
# `signal` and utilities this never calls, and being small is the
# product.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "fs",
    "signal",
    "macros",
    "time",
    "io-util",
] }

clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# The proxy leg. rustls itself comes through `wabot::rest::rustls`, so
# there is exactly one copy of it in the binary.
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"

# Self-signed certificates for the pre-DNS node, and later the CSRs
# ACME needs.
# `x509-parser` is what `CertificateParams::from_ca_cert_pem` needs:
# the local CA is stored as PEM and loaded back to sign each new leaf.
# The alternative — rebuilding the CA's parameters from memory and
# re-signing — would produce a *different* certificate than the one
# stored, and arguing about whether the chain still validates is worse
# than one dependency.
rcgen = { version = "0.13", features = ["x509-parser"] }
# Certificate validity windows. Pinned to what rcgen uses, so the
# `OffsetDateTime` handed to `CertificateParams` is the same type.
time = { version = "0.3", default-features = false, features = ["std"] }

# The route table: read on every request, replaced whole on the rare
# change. A lock would put every request behind the one writer.
arc-swap = "1"

# The renderer. A direct dependency because `rsx!` expands to absolute
# `::hypertext::…` paths, so re-exporting it from the framework is not
# enough — see `wabot::ui::hypertext::hypertext`. The version must match
# what the framework compiled against, or the types the macro produces
# are not the types its helpers accept.
hypertext = "0.12"

# ACME.
#
# `default-features = false` is load-bearing: the default is
# `aws-lc-rs`, and with the framework on `ring` both crypto providers
# end up enabled on rustls — which then refuses to pick one and
# **panics on first use**, in production as well as in tests. It would
# also drag in cmake, losing the "builds on a bare machine" property
# the framework chose `ring` for.
#
# `ring` here propagates to hyper-rustls too, so there is one crypto
# backend in the binary and no runtime choice to get wrong.
instant-acme = { version = "0.8", default-features = false, features = [
    "hyper-rustls",
    "ring",
] }
# The SQLite job store. A direct dependency because the umbrella crate
# declares `wabot-addon-async-sqlite` behind its `addon-async-sqlite`
# feature but never re-exports it, so there is no `wabot::` path to
# `SqliteJobRepository`. That missing re-export belongs upstream; this
# names the crate in the meantime.
wabot-addon-async-sqlite = "0.2"

# Reading a certificate's expiry. Already in the tree through rcgen's
# `x509-parser` feature, so this names it rather than adding it.
x509-parser = "0.16"
# `oneshot`, for calling the control-plane router in-process.
tower = { version = "0.5", features = ["util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading form bodies. A dependency `url` also brings, but naming it
# directly is honest about what it is used for.
form_urlencoded = "1"
# `#[async_trait]`, which the framework's Middleware trait uses.
async-trait = "0.1"
# The server-sent events stream on the node page: a body that yields
# a reading every couple of seconds and never ends.
async-stream = "0.3"
# containerd's content write is a client-streaming call, so a request
# has to arrive as a stream even when it is one message long.
tokio-stream = "0.1"
# The registry: decoding a Basic credential, and reading a layer off
# the wire in pieces rather than into memory.
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
# containerd's native gRPC API. Generated bindings only — there is no
# high-level client, so pulling, container creation and task lifecycle
# are ours to write.
#
# Needs `protoc` at build time: its build.rs generates the bindings
# from vendored protos. `scripts/deploy.sh` installs it.
containerd-client = "0.9"
# `channel` for the unix-socket connection, `codegen` for the generated
# client stubs. No `server`, no TLS features: the socket is a local file
# with 0660 root:root on it, and encrypting a hop that is a filesystem
# path would protect against an attacker who already has the machine.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
prost = "0.14"
prost-types = "0.14"

# OCI runtime and image specs. Typed builders rather than
# `serde_json::json!` by hand — this is the file runc reads, and a
# field in the wrong shape fails inside the shim where nothing explains
# it.
oci-spec = { version = "0.10", default-features = false, features = ["runtime", "image"] }

# Talking to GitHub: the release catalogue, and the binary itself.
#
# `webpki-tokio` — the bundled root certificates — rather than the
# machine's store. This ships as one static binary onto machines whose
# `/etc/ssl` is not something it configured, and an update that fails
# on a bare box because the trust store is somewhere else is exactly
# the failure this feature exists to avoid.
#
# `ring` to match the one crypto backend in the binary. Two enabled
# providers make rustls refuse to pick and panic on first use.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "webpki-tokio",
] }

# Verifying release downloads before anything runs them.
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The overlay: kernel WireGuard, configured over netlink from inside
# this process.
#
# The phase 2 spike decided this against `boringtun`, and against what
# `docs/network.md` had assumed. The argument for userspace was that
# requiring a kernel module reopens the class of failure Alpine keeps
# surfacing — but the module is in both nodes' kernels, and on Alpine
# `/dev/net/tun` does *not* exist until `tun` is loaded. Userspace does
# not avoid a module, it swaps `wireguard` for `tun` and adds the whole
# data path. See the spike's record in `docs/network.md`.
#
# Netlink rather than shelling out to `wg`: the product is one file
# copied to a machine, and `wireguard-tools` is absent on both nodes.
# This crate also brings `Key`, which generates and derives exactly the
# Curve25519 keys WireGuard reads — so `network::keys` has no separate
# x25519 dependency and the binary carries one copy of curve25519
# rather than two.
#
# `default-features = false` drops `serde` (nothing here serialises a
# key) and `check_dependencies`, which looks for external WireGuard
# binaries this deliberately does not use.
defguard_wireguard_rs = { version = "0.11", default-features = false }

[dev-dependencies]
# The harnesses are a separate feature so a mock adapter can never
# reach production by accident.
wabot = { version = "0.2", default-features = false, features = ["testing"] }
tempfile = "3"
# The job store the console harness runs against. In memory rather than
# the SQLite one a node uses: a test wants the queue's behaviour, not
# its durability, and this one needs no tables.
wabot-addon-async-in-memory = "0.2"

# What a release is built with.
#
# The binary is copied to a machine and lives there for months, so the
# trade is all one way: minutes of link time against every request it
# will ever serve. Fat LTO — the whole program optimised as one unit,
# not per crate — plus a single codegen unit and no symbols.
#
# It is slow and memory-hungry to build. That is CI's problem, and the
# reason `node` exists below.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# What `scripts/deploy.sh` builds with on the node itself.
#
# A release build on a one-core VM with under two gigabytes takes the
# machine down with it — rustc swaps until sshd stops answering, which
# is a thing that happened rather than a thing to worry about. This
# gives up the last of the optimisation to stay survivable: the node
# under test does not need the binary that ships.
[profile.node]
inherits = "release"
lto = "thin"
codegen-units = 4
